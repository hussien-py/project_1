name: APK conversion
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" setuptools

      - name: Apply build pins
        run: |
          sed -i -E '/^#? ?(p4a\.branch|android\.ndk|android\.api|android\.accept_sdk_license) *=/d' buildozer.spec
          sed -i -E 's/^requirements *=.*/requirements = python3,kivy==2.3.0/' buildozer.spec
          sed -i '/^\[app\]/a p4a.branch = v2024.01.21\nandroid.ndk = 25b\nandroid.api = 33\nandroid.accept_sdk_license = True' buildozer.spec
          grep -nE "^(p4a\.branch|android\.ndk|android\.api|android\.accept_sdk_license|requirements)" buildozer.spec

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
